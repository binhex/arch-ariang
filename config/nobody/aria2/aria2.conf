# ============================================================================
# aria2.conf
# Generated/validated against aria2 1.37.0
# AriaNg connects to: http://127.0.0.1:6800/jsonrpc
# ============================================================================

# --- Paths ------------------------------------------------------------------
dir=/config/aria2/downloads
save-session=/config/aria2/sessions/aria2.session
save-session-interval=30

# --- Daemon / RPC -----------------------------------------------------------
daemon=true
enable-rpc=true
rpc-listen-all=true
rpc-listen-port=6800
rpc-allow-origin-all=true
# TODO: strongly recommended if anything but localhost can reach this port
#rpc-secret=CHANGE-ME
rpc-max-request-size=16M
rpc-save-upload-metadata=true

# --- Resume / integrity -----------------------------------------------------
continue=true
check-integrity=true
auto-file-renaming=true
allow-overwrite=false
always-resume=true
max-resume-failure-tries=0

# --- Throughput -------------------------------------------------------------
max-concurrent-downloads=5
split=8
max-connection-per-server=8
min-split-size=10M
optimize-concurrent-downloads=true
max-overall-download-limit=0
max-download-limit=0

# --- Connection behaviour ---------------------------------------------------
timeout=60
connect-timeout=30
max-tries=5
retry-wait=10
lowest-speed-limit=0
check-certificate=true
http-accept-gzip=true
enable-http-keep-alive=true
user-agent=aria2/$VERSION
#optional: reuse a logged-in referer chain
#referer=*

# --- Disk / logging ---------------------------------------------------------
file-allocation=falloc
disk-cache=64M
console-log-level=notice
summary-interval=0
human-readable=true
max-download-result=1000

# --- archive.org cookies ----------------------------------------------------
# Preferred: aria2 scopes the cookie jar to archive.org domains automatically,
# so credentials are never sent to other hosts.
load-cookies=/config/aria2/cookies/cookies.txt
#
# Fallback: a static header. Sent to EVERY host if set globally, so only use
# it as a per-task option in AriaNg (New Task > Options > tick Http > Header).
#header=Cookie: logged-in-user=you%40example.com; logged-in-sig=CHANGEME

# --- BitTorrent (optional) --------------------------------------------------
bt-max-peers=55
bt-max-open-files=100
bt-require-crypto=false
follow-torrent=true
follow-metalink=true
seed-ratio=1.0
#bt-tracker=

# --- Misc -------------------------------------------------------------------
async-dns=true
disable-ipv6=false
min-tls-version=TLSv1.2
no-netrc=true
