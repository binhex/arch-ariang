
#user html;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    keepalive_timeout  65;

    server {
        listen       8127;
        server_name  localhost;

        location / {
            root   /opt/aria2;
            index  index.html index.htm;
        }

        # redirect server error pages to the static page /50x.html
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /opt/aria2;
        }
    }
}
